[project]
name = "brandpulse"
version = "0.1.0"
description = "Monitoramento da presença das marcas"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "limits>=5.8.0",
    "pydantic>=2.13.5",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

ignore = [
    "E501",
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]

[project.scripts]
brandpulse = "app.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pre-commit<4",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
